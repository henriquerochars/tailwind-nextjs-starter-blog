name: Engineering quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Linux full gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Immutable installation
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - name: Record tested versions and SHAs
        run: node scripts/agent/versions.mjs
        env:
          TESTED_INTEGRATION_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Install Chromium explicitly
        run: node .yarn/releases/yarn-4.18.1.cjs playwright install --with-deps chromium
      - name: Complete verification
        run: node .yarn/releases/yarn-4.18.1.cjs check
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  portable:
    name: macOS portable harness
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Immutable installation
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - name: Documentation and portable regressions
        run: |
          node .yarn/releases/yarn-4.18.1.cjs check:docs
          node .yarn/releases/yarn-4.18.1.cjs test:harness

  required-summary:
    name: Required quality summary
    needs: [quality, portable]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require every required job to succeed
        run: node scripts/agent/ci-summary.mjs
        env:
          HARNESS_JOB_RESULTS: ${{ toJSON(needs) }}
