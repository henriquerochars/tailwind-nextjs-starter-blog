name: Tooling validation

on:
  push:
    branches:
      - chore/issue-9-tooling

permissions:
  contents: write

concurrency:
  group: tooling-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --no-immutable
      - run: yarn build
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn format:check
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- yarn.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git commit -m "chore: refresh lockfile for tooling modernization"
          git push
