name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - qa/issue-12-blog-smoke

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Production build and content generation
        run: yarn build

      - name: Verify generated content artifacts
        run: yarn verify:generated

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: Run smoke and regression tests
        run: yarn test:e2e:ci

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
