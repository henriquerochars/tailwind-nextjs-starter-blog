name: CI

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - main
      - ci/issue-11-blog-ci

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- yarn.lock; then
            echo "yarn.lock is already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add yarn.lock
            git commit -m "chore: refresh lockfile for definitive CI"
            git push
          fi

      - name: Production build and content generation
        run: yarn build

      - name: Verify generated content artifacts
        run: yarn verify:generated

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check
