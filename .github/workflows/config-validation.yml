name: Config and security validation

on:
  push:
    branches:
      - maintenance/issue-10-config-security

concurrency:
  group: config-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Refresh lockfile
        run: yarn install --no-immutable

      - run: yarn build
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn format:check

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- yarn.lock; then
            echo "yarn.lock is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git commit -m "chore: refresh lockfile for config changes"
          git push
