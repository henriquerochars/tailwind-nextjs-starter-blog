name: Node 24 final validation
# Temporary validation workflow

on:
  push:
    branches:
      - chore/issue-3-node-24-final

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
